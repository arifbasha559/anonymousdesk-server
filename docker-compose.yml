version: "3.8"

services:
  api:
    build: .
    ports:
      - "4000:4000"
    env_file: .env
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  worker:
    build: .
    command: node src/queues/workers/index.js
    env_file: .env
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: anonymousdesk
      MYSQL_USER: anon
      MYSQL_PASSWORD: anonpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mysql_data:
